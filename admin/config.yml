              "name": "pt",
              "label": "Português",
              "widget": "text",
              "required": true
            },
            {
              "name": "en",
              "label": "English",
              "widget": "text",
              "required": false
            },
            {
              "name": "es",
              "label": "Español",
              "widget": "text",
              "required": false
