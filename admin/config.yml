# Painel (Sveltia CMS), Task 9. Gerado a partir do esquema do site (src/content.config.ts e os JSON de
# src/content/config). JSON também é YAML válido. Mudou um campo no site? Mude aqui também.
{
  "backend": {
    "name": "github",
    "repo": "Elliot-Parker/portfolio",
    "branch": "main",
    "base_url": "https://elliotparker.com.br",
    "auth_endpoint": "api/admin/auth",
    "commit_messages": {
      "create": "Painel: cria {{collection}} \"{{slug}}\"",
      "update": "Painel: atualiza {{collection}} \"{{slug}}\"",
      "delete": "Painel: apaga {{collection}} \"{{slug}}\"",
      "uploadMedia": "Painel: envia \"{{path}}\"",
      "deleteMedia": "Painel: apaga \"{{path}}\""
    }
  },
  "app_title": "Painel Elliot Parker",
  "logo": {
    "src": "/uploads/site/favicon.png",
    "show_in_header": true
  },
  "site_url": "https://elliotparker.com.br",
  "display_url": "https://elliotparker.com.br",
  "media_folder": "/public/uploads",
  "public_folder": "/uploads",
  "media_libraries": {
    "default": {
      "config": {
        "max_file_size": 10000000,
        "slugify_filename": true,
        "transformations": {
          "raster_image": {
            "format": "webp",
            "quality": 85,
            "width": 2560,
            "height": 2560
          }
        }
      }
    }
  },
  "slug": {
    "encoding": "ascii",
    "clean_accents": true
  },
  "collections": [
    {
      "name": "projetos",
      "label": "Publicados",
      "label_singular": "Projeto",
      "icon": "public",
      "folder": "src/content/projetos",
      "extension": "json",
      "format": "json",
      "create": true,
      "delete": true,
      "identifier_field": "url",
      "slug": "{{url}}",
      "summary": "{{titulo.pt}}  ·  {{publicado | ternary('Publicado', 'Rascunho')}}  ·  {{categoria.pt}}  ·  {{ano}}",
      "view_filters": [
        {
          "label": "Edição & Motion",
          "field": "areas",
          "pattern": "edicao-motion"
        },
        {
          "label": "UI Design",
          "field": "areas",
          "pattern": "ui-design"
        },
        {
          "label": "Design",
          "field": "areas",
          "pattern": "design"
        },
        {
          "label": "Fotografia com IA",
          "field": "areas",
          "pattern": "fotografia-ia"
        },
        {
          "label": "Web & Produto",
          "field": "areas",
          "pattern": "web-produto"
        }
      ],
      "view_groups": [
        {
          "label": "Situação",
          "field": "publicado"
        },
        {
          "label": "Ano",
          "field": "ano"
        }
      ],
      "media_folder": "/public/uploads/projetos/{{slug}}",
      "public_folder": "/uploads/projetos/{{slug}}",
      "sortable_fields": {
        "fields": [
          "commit_date",
          "titulo.pt",
          "ano"
        ],
        "default": {
          "field": "commit_date",
          "direction": "descending"
        }
      },
      "editor": {
        "preview": true
      },
      "preview_path": "work/{{slug}}",
      "fields": [
        {
          "name": "publicado",
          "label": "Publicado no site",
          "widget": "boolean",
          "default": false,
          "hint": "Desligado = rascunho: o projeto não aparece no site."
        },
        {
          "name": "url",
          "label": "Endereço (URL)",
          "widget": "string",
          "pattern": [
            "^[a-z0-9]+(?:[.-][a-z0-9]+)*$",
            "Só letras minúsculas sem acento, números, hífen e ponto"
          ],
          "hint": "Fica em elliotparker.com.br/work/endereço. Não pode repetir nem ser admin, api, work, en, es ou 404."
        },
        {
          "name": "titulo",
          "label": "Título",
          "widget": "object",
          "collapsed": false,
          "fields": [
            {
              "name": "pt",
              "label": "Português",
              "widget": "string",
              "required": true
            },
            {
              "name": "en",
              "label": "English",
              "widget": "string",
              "required": false
            },
            {
              "name": "es",
              "label": "Español",
              "widget": "string",
              "required": false
            }
          ]
        },
        {
          "name": "categoria",
          "label": "Categoria",
          "widget": "object",
          "collapsed": false,
          "fields": [
            {
              "name": "pt",
              "label": "Português",
              "widget": "string",
              "required": true
            },
            {
              "name": "en",
              "label": "English",
              "widget": "string",
              "required": false
            },
            {
              "name": "es",
              "label": "Español",
              "widget": "string",
              "required": false
            }
          ],
          "hint": "Ex.: Edição criativa, Poster, UI Design"
        },
        {
          "name": "areas",
          "label": "Áreas (filtros de Trabalhos)",
          "widget": "relation",
          "multiple": true,
          "collection": "trabalhos",
          "file": "trabalhos",
          "value_field": "filtros.areas.*.id",
          "search_fields": [
            "filtros.areas.*.rotulo.pt"
          ],
          "display_fields": [
            "filtros.areas.*.rotulo.pt"
          ],
          "hint": "Escolha uma ou mais. Áreas novas: Configurações > Página Trabalhos."
        },
        {
          "name": "ano",
          "label": "Ano",
          "widget": "number",
          "value_type": "int",
          "required": false,
          "min": 1900,
          "max": 2100
        },
        {
          "name": "siteAoVivo",
          "label": "Site ao vivo (botão Live View)",
          "widget": "string",
          "required": false,
          "pattern": [
            "^https://[^s\"'<>]+$",
            "Use um link que comece com https://"
          ],
          "hint": "Link do site real. Preenchido, aparece o botão \"Live View\" no topo do projeto, abrindo o site em outra aba. Vazio, o botão não aparece."
        },
        {
          "name": "resumoCard",
          "label": "Texto curto do card",
          "widget": "object",
          "collapsed": false,
          "fields": [
            {
              "name": "pt",
              "label": "Português",
              "widget": "string",
              "required": false
            },
            {
              "name": "en",
              "label": "English",
              "widget": "string",
              "required": false
            },
            {
              "name": "es",
              "label": "Español",
              "widget": "string",
              "required": false
            }
          ],
          "hint": "Opcional. Vazio: o card usa o começo do resumo.",
          "required": false
        },
        {
          "name": "resumo",
          "label": "Resumo (topo da página)",
          "widget": "object",
          "collapsed": false,
          "fields": [
            {
              "name": "pt",
              "label": "Português",
              "widget": "text",
              "required": true
            },
            {
              "name": "en",
              "label": "English",
              "widget": "text",
              "required": false
            },
            {
              "name": "es",
              "label": "Español",
              "widget": "text",
              "required": false
            }
